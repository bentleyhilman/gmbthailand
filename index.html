<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thailand Mission Trip Countdown</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter & Cinzel & Kanit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@300;400;500;600;700&family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        cinzel: ['Cinzel', 'serif'],
                        thai: ['Kanit', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(245, 158, 11, 0.3);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(245, 158, 11, 0.15);
        }
        .glass-panel-subtle {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .text-glow {
            text-shadow: 0 0 25px rgba(245, 158, 11, 0.7), 0 0 50px rgba(245, 158, 11, 0.3);
        }
        .gold-gradient-text {
            background: linear-gradient(135deg, #FFFBEB 0%, #FBBF24 40%, #F59E0B 70%, #D97706 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Continuous drifting ambient background light animations */
        @keyframes float-1 {
            0% { transform: translate(0px, 0px) scale(1); opacity: 0.45; }
            33% { transform: translate(120px, -80px) scale(1.25); opacity: 0.65; }
            66% { transform: translate(-60px, 100px) scale(0.9); opacity: 0.35; }
            100% { transform: translate(0px, 0px) scale(1); opacity: 0.45; }
        }

        @keyframes float-2 {
            0% { transform: translate(0px, 0px) scale(1.1); opacity: 0.5; }
            33% { transform: translate(-140px, 90px) scale(0.85); opacity: 0.3; }
            66% { transform: translate(90px, -110px) scale(1.3); opacity: 0.6; }
            100% { transform: translate(0px, 0px) scale(1.1); opacity: 0.5; }
        }

        @keyframes float-3 {
            0% { transform: translate(0px, 0px) scale(0.9); opacity: 0.35; }
            50% { transform: translate(100px, 120px) scale(1.2); opacity: 0.55; }
            100% { transform: translate(0px, 0px) scale(0.9); opacity: 0.35; }
        }

        @keyframes float-4 {
            0% { transform: translate(0px, 0px) scale(1); opacity: 0.4; }
            50% { transform: translate(-110px, -90px) scale(1.3); opacity: 0.6; }
            100% { transform: translate(0px, 0px) scale(1); opacity: 0.4; }
        }

        .orb-orange { animation: float-1 22s ease-in-out infinite; }
        .orb-blue { animation: float-2 26s ease-in-out infinite; }
        .orb-purple { animation: float-3 20s ease-in-out infinite; }
        .orb-amber { animation: float-4 28s ease-in-out infinite; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.8); }
        ::-webkit-scrollbar-thumb { background: rgba(245, 158, 11, 0.3); border-radius: 3px; }
    </style>
</head>

<body class="bg-slate-950 text-slate-100 font-sans min-h-screen relative overflow-x-hidden flex flex-col justify-center items-center py-6 select-none">

    <div class="fixed top-[-10%] left-[-10%] w-[55vw] h-[55vw] max-w-[700px] max-h-[700px] bg-amber-600/30 rounded-full blur-[140px] pointer-events-none orb-orange z-0"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[60vw] h-[60vw] max-w-[750px] max-h-[750px] bg-indigo-700/35 rounded-full blur-[150px] pointer-events-none orb-blue z-0"></div>
    <div class="fixed top-[20%] right-[-5%] w-[45vw] h-[45vw] max-w-[600px] max-h-[600px] bg-purple-900/40 rounded-full blur-[140px] pointer-events-none orb-purple z-0"></div>
    <div class="fixed bottom-[15%] left-[-5%] w-[50vw] h-[50vw] max-w-[650px] max-h-[650px] bg-orange-700/25 rounded-full blur-[150px] pointer-events-none orb-amber z-0"></div>

    <!-- Soft Center Ambient Atmosphere -->
    <div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[70vw] h-[70vw] max-w-[900px] max-h-[900px] bg-violet-950/30 rounded-full blur-[160px] pointer-events-none z-0"></div>

    <!-- Canvas for Dynamic Moving Ambient Background Light Waves -->
    <canvas id="bg-canvas"></canvas>

    <div class="relative z-10 max-w-5xl w-full mx-auto px-4 sm:px-6 lg:px-8 flex flex-col items-center">
        
        <!-- HEADER SECTION -->
        <header class="text-center mb-4">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-900/80 border border-amber-500/40 text-amber-300 text-xs font-semibold tracking-wider uppercase mb-3 shadow-lg">
                <span class="relative flex h-2 w-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-amber-500"></span>
                </span>
                <span>Thailand Mission Trip 2026</span>
            </div>

            <h1 class="text-4xl sm:text-5xl md:text-6xl font-extrabold tracking-tight font-cinzel gold-gradient-text drop-shadow-md mb-2">
                COUNTDOWN TO DEPARTURE
            </h1>
            <p class="text-slate-300 text-base sm:text-lg max-w-2xl mx-auto font-light">
                "Go into all the world and preach the gospel to all creation."
            </p>
        </header>

        <!-- COUNTDOWN DISPLAY SECTION -->
        <main class="w-full">
            <div class="glass-panel rounded-3xl p-6 sm:p-10 shadow-2xl relative overflow-hidden">
                <!-- Inner ambient shine -->
                <div class="absolute -top-24 -left-24 w-56 h-56 bg-amber-500/20 rounded-full blur-3xl pointer-events-none"></div>
                <div class="absolute -bottom-24 -right-24 w-56 h-56 bg-emerald-500/20 rounded-full blur-3xl pointer-events-none"></div>

                <!-- Timer Tiles Grid -->
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 sm:gap-6 text-center relative z-10">
                    
                    <!-- DAYS -->
                    <div class="glass-panel-subtle rounded-2xl p-4 sm:p-6 flex flex-col items-center justify-center border-t-2 border-t-amber-500/60 shadow-lg transform transition duration-300 hover:scale-[1.03] hover:border-t-amber-400">
                        <span id="days" class="text-4xl sm:text-6xl font-black font-mono text-white text-glow">000</span>
                        <span class="text-xs sm:text-sm uppercase tracking-widest text-amber-400 font-semibold mt-2">Days</span>
                    </div>

                    <!-- HOURS -->
                    <div class="glass-panel-subtle rounded-2xl p-4 sm:p-6 flex flex-col items-center justify-center border-t-2 border-t-amber-500/60 shadow-lg transform transition duration-300 hover:scale-[1.03] hover:border-t-amber-400">
                        <span id="hours" class="text-4xl sm:text-6xl font-black font-mono text-white text-glow">00</span>
                        <span class="text-xs sm:text-sm uppercase tracking-widest text-amber-400 font-semibold mt-2">Hours</span>
                    </div>

                    <!-- MINUTES -->
                    <div class="glass-panel-subtle rounded-2xl p-4 sm:p-6 flex flex-col items-center justify-center border-t-2 border-t-amber-500/60 shadow-lg transform transition duration-300 hover:scale-[1.03] hover:border-t-amber-400">
                        <span id="minutes" class="text-4xl sm:text-6xl font-black font-mono text-white text-glow">00</span>
                        <span class="text-xs sm:text-sm uppercase tracking-widest text-amber-400 font-semibold mt-2">Minutes</span>
                    </div>

                    <!-- SECONDS -->
                    <div class="glass-panel-subtle rounded-2xl p-4 sm:p-6 flex flex-col items-center justify-center border-t-2 border-t-amber-500/60 shadow-lg transform transition duration-300 hover:scale-[1.03] hover:border-t-amber-400">
                        <span id="seconds" class="text-4xl sm:text-6xl font-black font-mono text-amber-400 text-glow">00</span>
                        <span class="text-xs sm:text-sm uppercase tracking-widest text-amber-400 font-semibold mt-2">Seconds</span>
                    </div>

                </div>
            </div>
        </main>

    </div>

    <script>
        // TARGET DATE: Aug 1, 2026 at 18:00 (6:00 PM) PST/PDT (PDT is UTC-7)
        const TARGET_DATE = new Date("2026-08-01T18:00:00-07:00");

        function updateCountdown() {
            const now = new Date();
            const difference = TARGET_DATE - now;

            if (difference <= 0) {
                document.getElementById('days').innerText = "00";
                document.getElementById('hours').innerText = "00";
                document.getElementById('minutes').innerText = "00";
                document.getElementById('seconds').innerText = "00";
                return;
            }

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((difference / 1000 / 60) % 60);
            const seconds = Math.floor((difference / 1000) % 60);

            document.getElementById('days').innerText = days < 100 ? String(days).padStart(2, '0') : days;
            document.getElementById('hours').innerText = String(hours).padStart(2, '0');
            document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
            document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
        }

        function initCanvas() {
            const canvas = document.getElementById('bg-canvas');
            const ctx = canvas.getContext('2d');

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            let time = 0;

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                time += 0.008;

                // 1. DYNAMICALLY MOVING BACKGROUND COLOR GLOWS (Orange, Blue, Purple)
                const grad1X = canvas.width * (0.3 + 0.25 * Math.sin(time * 0.5));
                const grad1Y = canvas.height * (0.35 + 0.2 * Math.cos(time * 0.4));
                const g1 = ctx.createRadialGradient(grad1X, grad1Y, 20, grad1X, grad1Y, canvas.width * 0.5);
                g1.addColorStop(0, 'rgba(245, 158, 11, 0.12)');
                g1.addColorStop(1, 'rgba(245, 158, 11, 0)');

                ctx.fillStyle = g1;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                const grad2X = canvas.width * (0.7 + 0.2 * Math.cos(time * 0.4));
                const grad2Y = canvas.height * (0.65 + 0.25 * Math.sin(time * 0.5));
                const g2 = ctx.createRadialGradient(grad2X, grad2Y, 20, grad2X, grad2Y, canvas.width * 0.55);
                g2.addColorStop(0, 'rgba(99, 102, 241, 0.13)');
                g2.addColorStop(1, 'rgba(99, 102, 241, 0)');

                ctx.fillStyle = g2;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                const grad3X = canvas.width * (0.5 + 0.2 * Math.sin(time * 0.6));
                const grad3Y = canvas.height * (0.2 + 0.2 * Math.cos(time * 0.3));
                const g3 = ctx.createRadialGradient(grad3X, grad3Y, 20, grad3X, grad3Y, canvas.width * 0.45);
                g3.addColorStop(0, 'rgba(126, 34, 206, 0.12)');
                g3.addColorStop(1, 'rgba(126, 34, 206, 0)');

                ctx.fillStyle = g3;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                requestAnimationFrame(animate);
            }

            animate();
        }

        window.onload = function() {
            initCanvas();
            updateCountdown();
            setInterval(updateCountdown, 1000);
        };
    </script>
</body>
</html>
